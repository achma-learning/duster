<!DOCTYPE html>
<!--
  DACIA / DUSTER CLOCK  v12
  Cibles : autoradio Allwinner T3 K2001M (Android 6.0.1, WebView ~Chromium 44,
           1024x600) + tablette, en paysage.

  Esprit : logos d'epoque (blason chrome 2008-2021, embleme Duster), mise en
  page et comportement d'un Media Nav recent. Fond noir vrai.

  ES5 uniquement, pas de CSS variables, pas de grid, pas de clamp(). Hors ligne.

  MODE :  clock.html        -> sequence d'accueil + transformation des logos
          clock.html#idle   -> horloge immediate (ecran de veille)
-->

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  background:#000000;
  overflow:hidden;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  cursor:none;
  font-family:'DaciaText','DaciaCube','Roboto',Arial,sans-serif;
  color:#FFFFFF;
}

#stage {
  position:absolute; left:0; top:0;
  width:1000px; height:600px;
  -webkit-transform-origin:0 0; transform-origin:0 0;
  overflow:hidden; background:#000000;
  opacity:0; -webkit-transition:opacity .5s ease; transition:opacity .5s ease;
}
#stage.lit { opacity:1; }

#vig {
  position:absolute; left:0; top:0; width:1000px; height:600px; display:none;
  background:-webkit-radial-gradient(50% 45%, ellipse, rgba(24,27,28,1) 0%, rgba(0,0,0,1) 72%);
  background:radial-gradient(ellipse at 50% 45%, rgba(24,27,28,1) 0%, rgba(0,0,0,1) 72%);
}

/* ---------------------------------------------------------------
   LOGOS PARTAGES
   Ils ne sont pas dupliques entre l'accueil et l'horloge : c'est le
   MEME element qui glisse de sa position d'accueil vers son coin.
   Chaque logo est donc pose a sa position FINALE, et l'etat d'accueil
   n'est qu'un transform. Seul transform et opacity sont animes.
   --------------------------------------------------------------- */
#badge {
  position:absolute; opacity:0;
  -webkit-transition:-webkit-transform .85s cubic-bezier(.22,.61,.36,1), opacity .7s ease;
  transition:transform .85s cubic-bezier(.22,.61,.36,1), opacity .7s ease;
}
/* Blason centre horizontalement et agrandi : 72 px.
   Largeur = 72 x 455/400 = 81,9 -> left = 500 - 40,95 = 459,05.
   Centre final exactement (500, 70). */
#badge { left:459.05px; top:34px; height:72px; }

/* Etat d'accueil : 190 px, centre en (500, 180). 190/72 = 2,6389.
   Le blason etant deja centre horizontalement a l'arrivee, la composante X
   de la translation est nulle : le mouvement devient une simple descente
   verticale accompagnee d'une reduction. Rien ne derive lateralement. */
#stage.intro #badge { -webkit-transform:translate(0,110px) scale(2.6389);
                              transform:translate(0,110px) scale(2.6389); }

#badge.on { opacity:1; }
#stage.intro #badge { opacity:.98; }

/* ---------------- elements propres a l'accueil ---------------- */
#wcar {
  position:absolute; left:350px; top:322px; width:300px; opacity:0;
  -webkit-transform:translateX(40px); transform:translateX(40px);
  -webkit-transition:opacity .9s ease, -webkit-transform .9s ease;
  transition:opacity .9s ease, transform .9s ease;
}
#wcar.on { opacity:1; -webkit-transform:translateX(0); transform:translateX(0); }

#wmodel {
  position:absolute; left:0; top:486px; width:1000px; text-align:center;
  font-size:19px; letter-spacing:6px; text-transform:uppercase;
  color:#79817C; opacity:0;
  -webkit-transition:opacity .8s ease; transition:opacity .8s ease;
}
#wmodel.on { opacity:1; }

/* ---------------- horloge ---------------- */
#clockwrap {
  position:absolute; left:0; top:0; width:1000px; height:600px;
  padding:124px 58px 34px;
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column;
  opacity:0;
  -webkit-transition:opacity .7s ease; transition:opacity .7s ease;
}

#core {
  -webkit-box-flex:1; -webkit-flex:1; flex:1;
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column;
  -webkit-box-pack:center; -webkit-justify-content:center; justify-content:center;
  -webkit-box-align:center; -webkit-align-items:center; align-items:center;
}

#time {
  font-family:'DaciaText','DaciaCube','Roboto',Arial,sans-serif;
  font-size:205px; line-height:.88; font-weight:normal;
  white-space:nowrap;
}
/* Chakra Petch a des chiffres proportionnels : le "1" fait 0,382 em contre
   0,652 em pour le "0". Sans boite fixe, l'heure sauterait lateralement a
   chaque minute. tabular-nums n'existe pas en Chromium 44, d'ou ces boites. */
#time .dg { display:inline-block; width:.66em; text-align:center; }
#time .cl { display:inline-block; width:.26em; text-align:center; }

#date {
  margin-top:28px; font-size:24px; letter-spacing:7px;
  text-transform:uppercase; color:#74796F; white-space:nowrap;
}

#rule { height:3px; background:#DB5B26; width:100%; margin:20px 0 16px; }

#botrow {
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-box-align:center; -webkit-align-items:center; align-items:center;
  -webkit-box-pack:justify; -webkit-justify-content:space-between; justify-content:space-between;
}
#greet   { font-size:19px; letter-spacing:4.4px; text-transform:uppercase; color:#7E837A; }
#botlogo { height:24px; opacity:.92; }

/* Nuit profonde : on n'assombrit pas, on eteint des pixels. */
#stage.min #badge,
#stage.min #rule,
#stage.min #botrow { visibility:hidden; }
</style>
</head>
<body>

<script>
(function () {
  /* ===================== CONFIG ===================== */
  var CFG = {
    stageW      : 1000,
    stageH      : 600,
    fitMode     : 'contain',   /* 'contain' = tout visible | 'cover' = remplit, rogne */
    autoRotate  : true,        /* pivote la scene si l'ecran est en portrait */

    vignette    : false,       /* true = degrade de fond. Allume des pixels. */
    morph       : true,        /* false = fondu simple au lieu du glissement */

    welcomeMs   : 2200,        /* duree de l'accueil avant la transformation */
    modelLine   : 'Duster 1.5 dCi',

    showSeconds : false,
    dimEvening  : 0.82,        /* 19h-21h et 06h-07h */
    dimNight    : 0.60,        /* 21h-06h */
    /* Mode nuit "minimal" : n'affiche plus QUE l'heure et la date, en
       eteignant blason, embleme, filet et ligne du bas. C'est efficace pour
       la lumiere, mais ca fait disparaitre les logos. DESACTIVE par defaut.
       L'assombrissement dimNight/dimEvening, lui, reste actif. */
    minimalNight: false,
    minimalFrom : 22,
    minimalTo   : 6
  };
  /* ================================================== */

  var DAYS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  var MONTHS = ['Janvier','Fevrier','Mars','Avril','Mai','Juin',
                'Juillet','Aout','Septembre','Octobre','Novembre','Decembre'];

  var elStage = document.getElementById('stage');
  var elBadge = document.getElementById('badge');
  var elCar   = document.getElementById('wcar');
  var elModel = document.getElementById('wmodel');
  var elWrap  = document.getElementById('clockwrap');
  var elTime  = document.getElementById('time');
  var elDate  = document.getElementById('date');
  var elGreet = document.getElementById('greet');

  var IDLE = (window.location.hash === '#idle');

  if (CFG.vignette) document.getElementById('vig').style.display = 'block';
  elModel.innerHTML = CFG.modelLine || '';

  /* ---------- mise a l'echelle de la scene ---------- */
  function setT(t) { elStage.style.webkitTransform = t; elStage.style.transform = t; }

  function layout() {
    var W = CFG.stageW, H = CFG.stageH;

    /* Certains WebView renvoient 0 pour clientWidth/clientHeight au premier
       appel. Sans filet, s valait 0 et la scene disparaissait completement :
       ecran noir, aucune erreur JS. Chaine de replis + plancher a 50 px. */
    var vw = document.documentElement.clientWidth  || window.innerWidth  || screen.width  || W;
    var vh = document.documentElement.clientHeight || window.innerHeight || screen.height || H;
    if (!(vw > 50)) vw = W;
    if (!(vh > 50)) vh = H;

    var rot = CFG.autoRotate && (vh > vw);
    var aW = rot ? vh : vw, aH = rot ? vw : vh;
    var s = (CFG.fitMode === 'cover') ? Math.max(aW / W, aH / H) : Math.min(aW / W, aH / H);
    if (!isFinite(s) || s <= 0) s = 1;
    var dw = W * s, dh = H * s;

    if (rot) {
      setT('translate(' + Math.round((vw + dh) / 2) + 'px,' +
                          Math.round((vh - dw) / 2) + 'px) rotate(90deg) scale(' + s + ')');
    } else {
      setT('translate(' + Math.round((vw - dw) / 2) + 'px,' +
                          Math.round((vh - dh) / 2) + 'px) scale(' + s + ')');
    }
  }

  var rlTimer = null;
  function relayout() { if (rlTimer) clearTimeout(rlTimer); rlTimer = setTimeout(layout, 60); }
  window.addEventListener('resize', relayout, false);
  window.addEventListener('orientationchange', function () {
    setTimeout(layout, 80); setTimeout(layout, 350); setTimeout(layout, 900);
  }, false);

  /* ---------- horloge ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function boxed(str) {
    var out = '', ch;
    for (var i = 0; i < str.length; i++) {
      ch = str.charAt(i);
      out += '<span class="' + (ch === ':' ? 'cl' : 'dg') + '">' + ch + '</span>';
    }
    return out;
  }

  function greeting(h) {
    if (h < 5)  return 'Bonne route';
    if (h < 12) return 'Bonjour';
    if (h < 18) return 'Bon apres-midi';
    return 'Bonsoir';
  }

  function dim(h) {
    if (h >= 21 || h < 6) return CFG.dimNight;
    if (h >= 19 || h < 7) return CFG.dimEvening;
    return 1;
  }

  function minimal(h) {
    if (!CFG.minimalNight) return false;
    return (CFG.minimalFrom > CFG.minimalTo)
         ? (h >= CFG.minimalFrom || h < CFG.minimalTo)
         : (h >= CFG.minimalFrom && h < CFG.minimalTo);
  }

  var lastStamp = '', running = false;

  function stageClass() {
    var h = new Date().getHours();
    var c = 'lit';
    if (!running) c += ' intro';
    if (minimal(h)) c += ' min';
    elStage.className = c;
  }

  function paint(force) {
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
    var stamp = pad(h) + ':' + pad(m) + (CFG.showSeconds ? ':' + pad(s) : '');
    if (!force && stamp === lastStamp) return;
    lastStamp = stamp;

    elTime.innerHTML = boxed(stamp);
    elDate.innerHTML = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' +
                       MONTHS[d.getMonth()] + ' ' + d.getFullYear();
    elGreet.innerHTML = greeting(h);

    stageClass();
    if (running) elWrap.style.opacity = dim(h);
  }

  function tick() {
    paint(false);
    setTimeout(tick, CFG.showSeconds ? (1000 - (new Date().getTime() % 1000)) : 2000);
  }

  /* ---------- passage accueil -> horloge ---------- */
  function toClock() {
    running = true;
    elCar.className   = '';           // s'efface
    elModel.className = '';
    stageClass();                     // retire .intro : les logos glissent
    setTimeout(function () {
      elWrap.style.opacity = dim(new Date().getHours());
    }, 400);
  }

  function bootSequence() {
    elStage.className = 'lit intro';
    setTimeout(function () { elBadge.className = 'on'; }, 250);
    setTimeout(function () { elCar.className   = 'on'; }, 800);
    setTimeout(function () { elModel.className = 'on'; }, 1200);
    setTimeout(toClock, CFG.welcomeMs);
  }

  function immediate() {
    running = true;
    elCar.style.display = 'none';
    elModel.style.display = 'none';
    elBadge.className = 'on';
    stageClass();
    elWrap.style.opacity = dim(new Date().getHours());
  }

  /* Appui : plein ecran seulement. On ne rejoue pas l'accueil : une animation
     qui demarre seule pendant la conduite capte le regard pour rien. */
  document.body.addEventListener('click', function () {
    var e = document.documentElement;
    if (e.requestFullscreen) e.requestFullscreen();
    else if (e.webkitRequestFullscreen) e.webkitRequestFullscreen();
    setTimeout(layout, 400);
  }, false);

  layout();
  paint(true);

  if (IDLE || !CFG.morph) { immediate(); }
  else { setTimeout(bootSequence, 60); }

  tick();
})();
</script>
