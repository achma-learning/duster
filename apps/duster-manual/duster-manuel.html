-->

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  height:100%;
  background:#0C0E0F;
  color:#E8EBE8;
  font-family:'Roboto','Noto Sans','Droid Sans',Arial,sans-serif;
  font-size:17px; line-height:1.55;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:rgba(219,91,38,.25);
}
body { display:-webkit-box; display:-webkit-flex; display:flex;
       -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column; }

/* ---------------- en-tete ---------------- */
#top {
  -webkit-box-flex:0; -webkit-flex:none; flex:none;
  background:#000; border-bottom:2px solid #DB5B26;
  padding:10px 16px;
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-box-align:center; -webkit-align-items:center; align-items:center;
}
#badge { height:42px; -webkit-flex:none; flex:none; }
#titles { -webkit-box-flex:1; -webkit-flex:1; flex:1; padding:0 14px; min-width:0; }
#t1 { font-family:'DaciaCube','Roboto',Arial,sans-serif; font-size:19px;
      letter-spacing:1.5px; text-transform:uppercase; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; }
#t2 { font-size:12px; letter-spacing:2.4px; color:#7E837A; text-transform:uppercase;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

#langs { -webkit-flex:none; flex:none; }
#langs button {
  background:#15181a; color:#9AA09A; border:1px solid #262b2e;
  font:inherit; font-size:13px; letter-spacing:1px; text-transform:uppercase;
  padding:6px 10px; margin-left:4px; cursor:pointer; border-radius:0;
}
#langs button.on { background:#DB5B26; color:#fff; border-color:#DB5B26; }

/* ---------------- recherche ---------------- */
#searchbar {
  -webkit-flex:none; flex:none;
  padding:10px 16px; background:#0f1213; border-bottom:1px solid #1c2022;
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-box-align:center; -webkit-align-items:center; align-items:center;
}
#q {
  -webkit-box-flex:1; -webkit-flex:1; flex:1; min-width:0;
  background:#15181a; color:#E8EBE8; border:1px solid #2a2f32;
  font:inherit; font-size:17px; padding:10px 12px; border-radius:0;
  -webkit-appearance:none;
}
#q:focus { outline:none; border-color:#DB5B26; }
#clr {
  -webkit-flex:none; flex:none; margin-left:8px;
  background:none; border:1px solid #2a2f32; color:#9AA09A;
  font:inherit; font-size:14px; padding:9px 12px; cursor:pointer;
  display:none;
}

/* ---------------- corps ---------------- */
#body {
  -webkit-box-flex:1; -webkit-flex:1; flex:1;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:14px 16px 26px;
}

.note { font-size:13px; color:#6E736E; border-left:3px solid #2a2f32;
        padding:6px 0 6px 12px; margin-bottom:18px; }

.chap { margin-bottom:22px; }
.chaph {
  font-family:'DaciaCube','Roboto',Arial,sans-serif;
  font-size:14px; letter-spacing:3px; text-transform:uppercase;
  color:#DB5B26; padding-bottom:6px; margin-bottom:8px;
  border-bottom:1px solid #1c2022;
}
.item {
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-box-align:center; -webkit-align-items:center; align-items:center;
  padding:11px 10px; border-bottom:1px solid #14181a; cursor:pointer;
}
.item:active { background:#15181a; }
.item .ic { -webkit-flex:none; flex:none; width:30px; height:30px; margin-right:12px; }
.item .lb { -webkit-box-flex:1; -webkit-flex:1; flex:1; min-width:0; }
.item .sn { font-size:13px; color:#6E736E; margin-top:2px; }
.item .ar { -webkit-flex:none; flex:none; color:#3d4347; font-size:20px; }

/* stroke:currentColor est indispensable : sans lui les traces n'ont aucune
   couleur de contour et le SVG reste invisible, seuls les elements avec un
   fill explicite apparaissent. */
.ic svg { width:100%; height:100%; fill:none; stroke:currentColor;
          stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
.red   { color:#E2402F; }
.amber { color:#E8A020; }
.info  { color:#7FA3CE; }

/* ---------------- article ---------------- */
#art h2 {
  font-family:'DaciaCube','Roboto',Arial,sans-serif;
  font-size:24px; letter-spacing:1px; line-height:1.25; margin-bottom:4px;
}
#art .kicker { font-size:12px; letter-spacing:3px; text-transform:uppercase;
               color:#DB5B26; margin-bottom:14px; }
#art p { margin-bottom:13px; }
#art .lighthead {
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-box-align:center; -webkit-align-items:center; align-items:center;
  margin-bottom:14px;
}
#art .lighthead .ic { width:56px; height:56px; margin-right:16px; -webkit-flex:none; flex:none; }
.badgelvl { display:inline-block; font-size:11px; letter-spacing:2px;
            text-transform:uppercase; border:1px solid currentColor;
            padding:2px 8px; margin-top:6px; }

table.kv { width:100%; border-collapse:collapse; }
table.kv td { padding:9px 4px; border-bottom:1px solid #171b1d; vertical-align:top; }
table.kv td.k { color:#8A908A; width:52%; }
table.kv td.v { color:#E8EBE8; }

mark { background:#DB5B26; color:#fff; padding:0 2px; }

/* ---------------- pied ---------------- */
#foot {
  -webkit-flex:none; flex:none;
  border-top:1px solid #1c2022; background:#0f1213;
  padding:8px 12px;
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-box-align:center; -webkit-align-items:center; align-items:center;
}
#foot button {
  background:#15181a; color:#C6CBC6; border:1px solid #2a2f32;
  font:inherit; font-size:14px; padding:10px 14px; cursor:pointer;
  white-space:nowrap;
}
#foot button[disabled] { color:#3d4347; }
#foot .sp { -webkit-box-flex:1; -webkit-flex:1; flex:1; }
#duster { height:16px; opacity:.85; margin:0 10px; }

/* ---------------- arabe ---------------- */
html[dir="rtl"] body { font-family:'Noto Naskh Arabic','Droid Arabic Naskh','Noto Sans Arabic',Arial,sans-serif; }
html[dir="rtl"] #titles { padding:0 14px; }
html[dir="rtl"] #langs button { margin-left:0; margin-right:4px; }
html[dir="rtl"] .item .ic { margin-right:0; margin-left:12px; }
html[dir="rtl"] #art .lighthead .ic { margin-right:0; margin-left:16px; }
html[dir="rtl"] .note { border-left:none; border-right:3px solid #2a2f32;
                        padding:6px 12px 6px 0; }
html[dir="rtl"] #clr { margin-left:0; margin-right:8px; }
</style>
</head>

var DATA = {"ui": {"app": {"fr": "Manuel du conducteur", "en": "Driver's Manual", "ar": "دليل السائق", "es": "Manual del conductor"}, "sub": {"fr": "Duster 1.5 dCi · 2016", "en": "Duster 1.5 dCi · 2016", "ar": "داستر 1.5 dCi · 2016", "es": "Duster 1.5 dCi · 2016"}, "search": {"fr": "Rechercher dans le manuel…", "en": "Search the manual…", "ar": "ابحث في الدليل…", "es": "Buscar en el manual…"}, "toc": {"fr": "Sommaire", "en": "Contents", "ar": "الفهرس", "es": "Índice"}, "back": {"fr": "Sommaire", "en": "Contents", "ar": "الفهرس", "es": "Índice"}, "prev": {"fr": "Précédent", "en": "Previous", "ar": "السابق", "es": "Anterior"}, "next": {"fr": "Suivant", "en": "Next", "ar": "التالي", "es": "Siguiente"}, "nores": {"fr": "Aucun résultat", "en": "No results", "ar": "لا توجد نتائج", "es": "Sin resultados"}, "results": {"fr": "résultat(s)", "en": "result(s)", "ar": "نتيجة", "es": "resultado(s)"}, "of": {"fr": "sur", "en": "of", "ar": "من", "es": "de"}, "clear": {"fr": "Effacer", "en": "Clear", "ar": "مسح", "es": "Borrar"}, "note": {"fr": "Contenu adapté à un Duster 4x2 1.5 dCi de 2016. Les équipements 4x4 et essence ont été retirés.", "en": "Content tailored to a 2016 4x2 1.5 dCi Duster. 4x4 and petrol equipment has been removed.", "ar": "محتوى مُكيَّف مع داستر 4x2 1.5 dCi موديل 2016. تمت إزالة تجهيزات الدفع الرباعي والبنزين.", "es": "Contenido adaptado a un Duster 4x2 1.5 dCi de 2016. Se han retirado los equipos 4x4 y gasolina."}}, "chapters": [{"id": "bord", "t": {"fr": "Tableau de bord", "en": "Instrument panel", "ar": "لوحة القيادة", "es": "Cuadro de instrumentos"}}, {"id": "temoins", "t": {"fr": "Témoins lumineux", "en": "Warning lights", "ar": "مصابيح التحذير", "es": "Testigos luminosos"}}, {"id": "conduite", "t": {"fr": "Conduite", "en": "Driving", "ar": "القيادة", "es": "Conducción"}}, {"id": "securite", "t": {"fr": "Sécurité", "en": "Safety", "ar": "السلامة", "es": "Seguridad"}}, {"id": "entretien", "t": {"fr": "Entretien", "en": "Maintenance", "ar": "الصيانة", "es": "Mantenimiento"}}, {"id": "pneus", "t": {"fr": "Pneumatiques", "en": "Tyres", "ar": "الإطارات", "es": "Neumáticos"}}, {"id": "panne", "t": {"fr": "En cas de panne", "en": "Breakdown", "ar": "في حالة العطل", "es": "En caso de avería"}}, {"id": "specs", "t": {"fr": "Caractéristiques", "en": "Specifications", "ar": "المواصفات", "es": "Características"}}], "sections": [{"id": "t_stop", "ch": "temoins", "kind": "light", "icon": "stop", "lvl": "red", "t": {"fr": "Arrêt impératif", "en": "Mandatory stop", "ar": "توقف إجباري", "es": "Parada obligatoria"}, "b": {"fr": ["S'allume avec un autre témoin et un bip. Arrêtez-vous dès que la circulation le permet, coupez le moteur et ne le redémarrez pas. Appelez un représentant de la marque."], "en": ["Comes on with another light and a beep. Stop as soon as traffic allows, switch off the engine and do not restart it. Call a brand representative."], "ar": ["يضيء مع مصباح آخر وصفير. توقف حالما تسمح حركة السير، أطفئ المحرك ولا تعد تشغيله. اتصل بوكيل العلامة."], "es": ["Se enciende junto a otro testigo y un pitido. Deténgase en cuanto el tráfico lo permita, apague el motor y no lo vuelva a arrancar. Llame a un representante de la marca."]}}, {"id": "t_oil", "ch": "temoins", "kind": "light", "icon": "oil", "lvl": "red", "t": {"fr": "Pression d'huile", "en": "Oil pressure", "ar": "ضغط الزيت", "es": "Presión de aceite"}, "b": {"fr": ["Doit s'éteindre dès que le moteur tourne. S'il s'allume en roulant : arrêtez-vous impérativement, coupez le contact et vérifiez le niveau d'huile. Niveau correct ? La cause est ailleurs — ne repartez pas."], "en": ["Must go out once the engine is running. If it comes on while driving: stop immediately, switch off the ignition and check the oil level. Level correct? The cause lies elsewhere — do not drive on."], "ar": ["يجب أن ينطفئ بمجرد دوران المحرك. إذا أضاء أثناء السير: توقف فوراً، أطفئ التشغيل وافحص مستوى الزيت. المستوى سليم؟ السبب في مكان آخر — لا تكمل الطريق."], "es": ["Debe apagarse en cuanto el motor gira. Si se enciende en marcha: deténgase obligatoriamente, corte el contacto y compruebe el nivel de aceite. ¿Nivel correcto? La causa es otra — no siga circulando."]}}, {"id": "t_batt", "ch": "temoins", "kind": "light", "icon": "batt", "lvl": "red", "t": {"fr": "Charge batterie", "en": "Battery charge", "ar": "شحن البطارية", "es": "Carga de la batería"}, "b": {"fr": ["Doit s'éteindre dès que le moteur tourne. Allumé sur route : surcharge ou décharge du circuit électrique. Arrêtez-vous et faites appel à un représentant."], "en": ["Must go out once the engine is running. On while driving: the electrical circuit is over- or under-charging. Stop and call a representative."], "ar": ["يجب أن ينطفئ بمجرد دوران المحرك. إذا أضاء على الطريق: شحن زائد أو تفريغ في الدائرة الكهربائية. توقف واتصل بالوكيل."], "es": ["Debe apagarse en cuanto el motor gira. Encendido en carretera: sobrecarga o descarga del circuito eléctrico. Deténgase y llame a un representante."]}}, {"id": "t_temp", "ch": "temoins", "kind": "light", "icon": "temp", "lvl": "red", "t": {"fr": "Température liquide de refroidissement", "en": "Coolant temperature", "ar": "حرارة سائل التبريد", "es": "Temperatura del refrigerante"}, "b": {"fr": ["Arrêtez-vous et laissez tourner au ralenti une à deux minutes : la température doit baisser. Sinon coupez le moteur, laissez refroidir, puis vérifiez le niveau de liquide et la propreté du radiateur."], "en": ["Stop and idle the engine for one or two minutes: the temperature should fall. Otherwise switch off, let it cool, then check the coolant level and that the radiator is clean."], "ar": ["توقف واترك المحرك يدور على الحد الأدنى دقيقة أو دقيقتين: يجب أن تنخفض الحرارة. وإلا أطفئ المحرك، اتركه يبرد، ثم افحص مستوى السائل ونظافة المشعاع."], "es": ["Deténgase y deje el motor al ralentí uno o dos minutos: la temperatura debe bajar. Si no, apague el motor, deje enfriar y compruebe el nivel de líquido y la limpieza del radiador."]}}, {"id": "t_brake", "ch": "temoins", "kind": "light", "icon": "brake", "lvl": "red", "t": {"fr": "Frein à main / circuit de freinage", "en": "Handbrake / brake circuit", "ar": "فرملة اليد / دائرة الفرامل", "es": "Freno de mano / circuito de frenos"}, "b": {"fr": ["Vérifiez d'abord que le frein à main est complètement desserré. S'il reste allumé, c'est le signe d'une baisse de niveau dans les circuits de freinage. Continuer à rouler peut être dangereux."], "en": ["First check that the handbrake is fully released. If it stays on, it indicates a drop in brake circuit level. Driving on may be dangerous."], "ar": ["تأكد أولاً أن فرملة اليد محررة تماماً. إذا بقي مضاءً، فهذا مؤشر على انخفاض المستوى في دوائر الفرامل. متابعة السير قد تكون خطيرة."], "es": ["Compruebe primero que el freno de mano está totalmente quitado. Si sigue encendido, indica una bajada de nivel en los circuitos de freno. Seguir circulando puede ser peligroso."]}}, {"id": "t_abs", "ch": "temoins", "kind": "light", "icon": "abs", "lvl": "amber", "t": {"fr": "Antiblocage des roues (ABS)", "en": "Anti-lock braking (ABS)", "ar": "نظام منع انغلاق العجلات", "es": "Antibloqueo de ruedas (ABS)"}, "b": {"fr": ["S'allume contact mis et s'éteint sous trois secondes. Allumé en roulant : l'ABS est en défaut. Le freinage reste assuré comme sur un véhicule sans ABS. Consultez rapidement."], "en": ["Comes on with the ignition and goes out within three seconds. On while driving: the ABS has failed. Braking still works as on a car without ABS. Have it checked promptly."], "ar": ["يضيء عند تشغيل المفتاح وينطفئ خلال ثلاث ثوانٍ. مضاء أثناء السير: عطل في نظام ABS. الفرملة تبقى عاملة كسيارة بدون ABS. راجع الوكيل سريعاً."], "es": ["Se enciende al dar contacto y se apaga en tres segundos. Encendido en marcha: fallo del ABS. La frenada sigue funcionando como en un vehículo sin ABS. Acuda pronto al taller."]}}, {"id": "t_airbag", "ch": "temoins", "kind": "light", "icon": "airbag", "lvl": "amber", "t": {"fr": "Airbag", "en": "Airbag", "ar": "الوسادة الهوائية", "es": "Airbag"}, "b": {"fr": ["S'allume au démarrage puis s'éteint après quelques secondes. S'il ne s'allume pas du tout, ou s'il s'allume moteur tournant, le système est en défaut. Consultez au plus tôt."], "en": ["Comes on at start-up then goes out after a few seconds. If it never comes on, or comes on with the engine running, the system has failed. Have it checked as soon as possible."], "ar": ["يضيء عند التشغيل ثم ينطفئ بعد ثوانٍ. إذا لم يضئ إطلاقاً، أو أضاء والمحرك يدور، فالنظام معطل. راجع الوكيل في أقرب وقت."], "es": ["Se enciende al arrancar y se apaga tras unos segundos. Si no se enciende nunca, o se enciende con el motor en marcha, el sistema falla. Acuda cuanto antes."]}}, {"id": "t_esp", "ch": "temoins", "kind": "light", "icon": "esp", "lvl": "amber", "t": {"fr": "ESP / ASR", "en": "ESP / ASR", "ar": "نظام الثبات ESP / ASR", "es": "ESP / ASR"}, "b": {"fr": ["Clignote quand le système corrige la trajectoire — c'est normal. Fixe avec le témoin de défaillance électronique : ESP et ASR sont désactivés, consultez. Sur un 4x2, l'ESP ne peut pas être coupé manuellement."], "en": ["Flashes when the system is correcting the car's path — this is normal. Steady, together with the electronic fault light: ESP and ASR are off, have it checked. On a 4x2 the ESP cannot be switched off manually."], "ar": ["يومض عندما يصحح النظام مسار السيارة — هذا طبيعي. مضاء بثبات مع مصباح العطل الإلكتروني: ESP و ASR متوقفان، راجع الوكيل. في نسخة 4x2 لا يمكن إطفاء ESP يدوياً."], "es": ["Parpadea cuando el sistema corrige la trayectoria — es normal. Fijo junto al testigo de fallo electrónico: ESP y ASR están desactivados, acuda al taller. En un 4x2 el ESP no puede desconectarse manualmente."]}}, {"id": "t_eng", "ch": "temoins", "kind": "light", "icon": "eng", "lvl": "amber", "t": {"fr": "Contrôle antipollution", "en": "Emission control", "ar": "مراقبة التلوث", "es": "Control anticontaminación"}, "b": {"fr": ["Allumé en continu : consultez au plus tôt. Clignotant : réduisez le régime moteur jusqu'à ce que le clignotement cesse, puis consultez au plus tôt."], "en": ["Steady: have it checked as soon as possible. Flashing: reduce engine speed until the flashing stops, then have it checked as soon as possible."], "ar": ["مضاء باستمرار: راجع الوكيل في أقرب وقت. يومض: خفّض دوران المحرك حتى يتوقف الوميض، ثم راجع الوكيل سريعاً."], "es": ["Fijo: acuda cuanto antes. Parpadeando: reduzca el régimen del motor hasta que deje de parpadear y acuda cuanto antes."]}}, {"id": "t_glow", "ch": "temoins", "kind": "light", "icon": "glow", "lvl": "info", "t": {"fr": "Préchauffage diesel", "en": "Diesel preheating", "ar": "التسخين المسبق للديزل", "es": "Precalentamiento diésel"}, "b": {"fr": ["Contact mis, il indique que les bougies de préchauffage travaillent. Il s'éteint quand le préchauffage est obtenu : le moteur peut alors être démarré. S'il reste allumé ou s'allume en roulant, c'est une défaillance électrique ou électronique."], "en": ["With the ignition on, it shows the glow plugs are working. It goes out once preheating is done: the engine can then be started. If it stays on, or comes on while driving, it signals an electrical or electronic fault."], "ar": ["عند تشغيل المفتاح، يدل على أن شمعات التسخين تعمل. ينطفئ عند اكتمال التسخين: عندها يمكن تشغيل المحرك. إذا بقي مضاءً أو أضاء أثناء السير، فهو عطل كهربائي أو إلكتروني."], "es": ["Con el contacto dado, indica que las bujías de precalentamiento están funcionando. Se apaga cuando el precalentamiento ha terminado: entonces puede arrancarse el motor. Si permanece encendido o se enciende en marcha, señala un fallo eléctrico o electrónico."]}}, {"id": "t_water", "ch": "temoins", "kind": "light", "icon": "water", "lvl": "amber", "t": {"fr": "Eau dans le filtre à gazole", "en": "Water in the diesel filter", "ar": "ماء في مرشح الديزل", "es": "Agua en el filtro de gasóleo"}, "b": {"fr": ["Reste allumé ou s'allume en roulant : de l'eau est présente dans le filtre à gazole. Consultez au plus tôt un représentant de la marque."], "en": ["Stays on or comes on while driving: there is water in the diesel filter. See a brand representative as soon as possible."], "ar": ["يبقى مضاءً أو يضيء أثناء السير: يوجد ماء في مرشح الديزل. راجع وكيل العلامة في أقرب وقت."], "es": ["Permanece encendido o se enciende en marcha: hay agua en el filtro de gasóleo. Acuda cuanto antes a un representante de la marca."]}}, {"id": "t_minioil", "ch": "temoins", "kind": "light", "icon": "minioil", "lvl": "amber", "t": {"fr": "Vidange moteur", "en": "Engine oil change", "ar": "تغيير زيت المحرك", "es": "Cambio de aceite"}, "b": {"fr": ["S'allume dès qu'une vidange est nécessaire. Attention : seule la distance parcourue est comptée, pas le temps écoulé. La vidange se fait au premier des deux termes atteints — vous pouvez donc devoir la faire avant que le témoin s'allume."], "en": ["Comes on when an oil change is due. Note: only distance is counted, not elapsed time. The change is due at whichever limit comes first — so you may need to do it before the light ever appears."], "ar": ["يضيء عندما يحين موعد تغيير الزيت. انتبه: المسافة وحدها هي المحسوبة، وليس الوقت المنقضي. التغيير يتم عند أول حد يُبلغ — لذا قد تحتاج إليه قبل أن يضيء المصباح."], "es": ["Se enciende cuando toca cambiar el aceite. Atención: solo se cuenta la distancia recorrida, no el tiempo transcurrido. El cambio corresponde al primero de los dos límites alcanzado — puede que deba hacerlo antes de que el testigo se encienda."]}}, {"id": "t_fuel", "ch": "temoins", "kind": "light", "icon": "fuel", "lvl": "amber", "t": {"fr": "Niveau mini carburant", "en": "Low fuel", "ar": "الحد الأدنى للوقود", "es": "Nivel mínimo de combustible"}, "b": {"fr": ["S'allume au démarrage puis s'éteint après trois secondes. S'il reste allumé, faites le plein dès que possible."], "en": ["Comes on at start-up then goes out after three seconds. If it stays on, refuel as soon as you can."], "ar": ["يضيء عند التشغيل ثم ينطفئ بعد ثلاث ثوانٍ. إذا بقي مضاءً، املأ الخزان في أقرب فرصة."], "es": ["Se enciende al arrancar y se apaga tras tres segundos. Si permanece encendido, reposte cuanto antes."]}}, {"id": "t_belt", "ch": "temoins", "kind": "light", "icon": "belt", "lvl": "red", "t": {"fr": "Ceinture non bouclée", "en": "Seat belt not fastened", "ar": "حزام الأمان غير مربوط", "es": "Cinturón sin abrochar"}, "b": {"fr": ["Fixe sur la console centrale au démarrage. Vers 10 km/h, si une ceinture avant n'est pas bouclée, il clignote et un signal sonore retentit environ 90 secondes."], "en": ["Steady on the centre console at start-up. At around 10 kph, if a front belt is unfastened, it flashes and a buzzer sounds for about 90 seconds."], "ar": ["مضاء بثبات على الكونسول الأوسط عند التشغيل. عند حوالي 10 كم/س، إذا لم يكن حزام أمامي مربوطاً، يومض ويصدر صوت تنبيه لنحو 90 ثانية."], "es": ["Fijo en la consola central al arrancar. Hacia 10 km/h, si un cinturón delantero no está abrochado, parpadea y suena un aviso durante unos 90 segundos."]}}, {"id": "t_door", "ch": "temoins", "kind": "light", "icon": "door", "lvl": "info", "t": {"fr": "Porte ouverte", "en": "Door open", "ar": "باب مفتوح", "es": "Puerta abierta"}, "b": {"fr": ["Indique qu'une porte ou le coffre n'est pas correctement fermé."], "en": ["Indicates that a door or the boot is not properly closed."], "ar": ["يشير إلى أن باباً أو صندوق الأمتعة غير مغلق بإحكام."], "es": ["Indica que una puerta o el maletero no está bien cerrado."]}}, {"id": "poste", "ch": "bord", "kind": "text", "t": {"fr": "Poste de conduite", "en": "Driving position", "ar": "مقصورة القيادة", "es": "Puesto de conducción"}, "b": {"fr": ["Manette gauche : clignotants, éclairage extérieur, feux de brouillard, avertisseur sonore.", "Manette droite : essuie-vitre et lave-vitre avant et arrière, défilement des informations de l'ordinateur de bord.", "Console centrale : feux de détresse, condamnation électrique des portes, condamnation des lève-vitres arrière.", "Bas de planche de bord : réglage de la hauteur des faisceaux, déverrouillage du capot, trappe à fusibles."], "en": ["Left stalk: indicators, exterior lighting, fog lights, horn.", "Right stalk: front and rear wiper and washer, scrolling through trip computer information.", "Centre console: hazard lights, electric door locking, rear window lock.", "Lower dashboard: headlight beam height, bonnet release, fuse flap."], "ar": ["الذراع الأيسر: الغمازات، الإضاءة الخارجية، أضواء الضباب، المنبه.", "الذراع الأيمن: مساحات وغسيل الزجاج الأمامي والخلفي، تصفح معلومات كمبيوتر القيادة.", "الكونسول الأوسط: أضواء الخطر، القفل الكهربائي للأبواب، قفل نوافذ الخلف.", "أسفل لوحة القيادة: ضبط ارتفاع المصابيح، فتح غطاء المحرك، صندوق المصهرات."], "es": ["Mando izquierdo: intermitentes, alumbrado exterior, antiniebla, claxon.", "Mando derecho: limpia y lavaparabrisas delantero y trasero, desplazamiento por la información del ordenador de a bordo.", "Consola central: luces de emergencia, cierre eléctrico de puertas, bloqueo de elevalunas traseros.", "Parte baja del salpicadero: reglaje de altura de los faros, apertura del capó, tapa de fusibles."]}}, {"id": "indic", "ch": "bord", "kind": "text", "t": {"fr": "Afficheur et indicateurs", "en": "Display and gauges", "ar": "الشاشة والمؤشرات", "es": "Visualizador e indicadores"}, "b": {"fr": ["Compte-tours gradué en milliers de tours par minute, indicateur de vitesse en km/h.", "Jauge de carburant à pavés : quand tous les pavés sont éteints, le témoin de niveau mini s'allume.", "Température du liquide de refroidissement : il n'y a alerte que si les trois derniers pavés s'allument.", "Alarme de survitesse : selon véhicule, un signal sonore retentit environ 10 secondes toutes les 30 secondes au-delà de 120 km/h."], "en": ["Rev counter in thousands of rpm, speedometer in kph.", "Segmented fuel gauge: when every segment is out, the low fuel light comes on.", "Coolant temperature: there is only a warning if the last three segments light up.", "Overspeed alarm: on some vehicles a buzzer sounds for about 10 seconds every 30 seconds above 120 kph."], "ar": ["عداد الدوران بآلاف اللفات في الدقيقة، وعداد السرعة بالكيلومتر/ساعة.", "مؤشر الوقود المقسّم: عندما تنطفئ كل الخانات يضيء مصباح الحد الأدنى.", "حرارة سائل التبريد: لا يوجد إنذار إلا إذا أضاءت الخانات الثلاث الأخيرة.", "إنذار تجاوز السرعة: حسب السيارة، يصدر صوت لنحو 10 ثوانٍ كل 30 ثانية فوق 120 كم/س."], "es": ["Cuentarrevoluciones en miles de vueltas por minuto, velocímetro en km/h.", "Indicador de combustible por segmentos: cuando todos están apagados se enciende el testigo de mínimo.", "Temperatura del refrigerante: solo hay alerta si se encienden los tres últimos segmentos.", "Alarma de exceso de velocidad: según vehículo, suena unos 10 segundos cada 30 segundos por encima de 120 km/h."]}}, {"id": "ordi", "ch": "bord", "kind": "text", "t": {"fr": "Ordinateur de bord", "en": "Trip computer", "ar": "كمبيوتر القيادة", "es": "Ordenador de a bordo"}, "b": {"fr": ["Appuis successifs sur la touche de sélection : totalisateur général, totalisateur partiel, carburant consommé, consommation moyenne, autonomie prévisible, distance parcourue, vitesse moyenne.", "Appui long sur la touche Top Départ : remise à zéro du totalisateur partiel ou du paramètre affiché.", "Les valeurs se stabilisent à mesure que la distance depuis le dernier Top Départ augmente.", "L'autonomie peut augmenter en roulant : elle suit la consommation moyenne, qui baisse quand le moteur chauffe ou quand vous passez de la ville à la route."], "en": ["Successive presses on the select button: total odometer, trip odometer, fuel used, average consumption, estimated range, distance travelled, average speed.", "Long press on the reset button: zeroes the trip odometer or the displayed value.", "Readings settle as the distance since the last reset grows.", "Range can rise while driving: it follows average consumption, which falls as the engine warms up or when you move from town to open road."], "ar": ["ضغطات متتالية على زر الاختيار: العداد الإجمالي، العداد الجزئي، الوقود المستهلك، المعدل الوسطي للاستهلاك، المدى المتوقع، المسافة المقطوعة، السرعة الوسطية.", "ضغطة طويلة على زر التصفير: تصفير العداد الجزئي أو القيمة المعروضة.", "تستقر القيم كلما زادت المسافة منذ آخر تصفير.", "قد يرتفع المدى أثناء السير: فهو يتبع معدل الاستهلاك الذي ينخفض عندما يسخن المحرك أو عند الانتقال من المدينة إلى الطريق."], "es": ["Pulsaciones sucesivas en el botón de selección: cuentakilómetros total, parcial, combustible consumido, consumo medio, autonomía estimada, distancia recorrida, velocidad media.", "Pulsación larga en el botón de puesta a cero: reinicia el parcial o el valor mostrado.", "Los valores se estabilizan a medida que crece la distancia desde la última puesta a cero.", "La autonomía puede subir en marcha: sigue al consumo medio, que baja cuando el motor se calienta o al pasar de ciudad a carretera."]}}, {"id": "demarrage", "ch": "conduite", "kind": "text", "t": {"fr": "Démarrage du moteur", "en": "Starting the engine", "ar": "تشغيل المحرك", "es": "Arranque del motor"}, "b": {"fr": ["Contact mis, le témoin de préchauffage s'allume. Attendez qu'il s'éteigne avant d'actionner le démarreur — c'est le point qui distingue un diesel d'un essence.", "Par temps froid, le préchauffage dure plus longtemps. N'insistez pas au démarreur plus de quelques secondes d'affilée.", "Laissez le moteur monter en température sans le solliciter : les premiers kilomètres se font en douceur."], "en": ["With the ignition on, the preheating light comes on. Wait for it to go out before turning the starter — this is what sets a diesel apart from a petrol.", "In cold weather preheating takes longer. Do not crank for more than a few seconds at a time.", "Let the engine warm up without pushing it: take the first few kilometres gently."], "ar": ["عند تشغيل المفتاح يضيء مصباح التسخين المسبق. انتظر انطفاءه قبل إدارة المحرك — هذه النقطة تميز الديزل عن البنزين.", "في الطقس البارد يستغرق التسخين وقتاً أطول. لا تُطل إدارة المارش أكثر من ثوانٍ قليلة في المرة.", "اترك المحرك يصل إلى حرارته دون إجهاد: الكيلومترات الأولى بهدوء."], "es": ["Con el contacto dado, se enciende el testigo de precalentamiento. Espere a que se apague antes de accionar el motor de arranque — esto distingue a un diésel de un gasolina.", "Con frío el precalentamiento dura más. No insista con el arranque más de unos segundos seguidos.", "Deje que el motor alcance temperatura sin exigirle: los primeros kilómetros, con suavidad."]}}, {"id": "esp2", "ch": "conduite", "kind": "text", "t": {"fr": "ESP, ASR et contrôle de sous-virage", "en": "ESP, ASR and understeer control", "ar": "ESP و ASR والتحكم في الانزلاق", "es": "ESP, ASR y control de subviraje"}, "b": {"fr": ["Un capteur au volant lit la trajectoire voulue, d'autres capteurs mesurent la trajectoire réelle. Le système corrige l'écart en freinant certaines roues ou en réduisant la puissance moteur.", "Le témoin ESP clignote pendant une correction : c'est le fonctionnement normal, pas une panne.", "L'ASR limite le patinage des roues motrices au démarrage, à l'accélération et à la décélération.", "Sur un Duster 4x2, il n'y a pas de contacteur de désactivation : l'ESP ne peut pas être coupé à la main."], "en": ["A steering sensor reads the path you want, other sensors measure the actual path. The system corrects the difference by braking individual wheels or cutting engine power.", "The ESP light flashes during a correction: that is normal operation, not a fault.", "ASR limits driven-wheel spin when pulling away, accelerating and slowing down.", "On a 4x2 Duster there is no cut-off switch: ESP cannot be turned off by hand."], "ar": ["مستشعر في المقود يقرأ المسار المطلوب، ومستشعرات أخرى تقيس المسار الفعلي. يصحح النظام الفارق بفرملة عجلات معينة أو بخفض قوة المحرك.", "يومض مصباح ESP أثناء التصحيح: هذا عمل طبيعي وليس عطلاً.", "يحد ASR من انزلاق العجلات المحركة عند الانطلاق والتسارع والتباطؤ.", "في داستر 4x2 لا يوجد مفتاح إيقاف: لا يمكن إطفاء ESP يدوياً."], "es": ["Un sensor en el volante lee la trayectoria deseada, otros sensores miden la real. El sistema corrige la diferencia frenando ruedas concretas o reduciendo la potencia del motor.", "El testigo ESP parpadea durante una corrección: es funcionamiento normal, no una avería.", "El ASR limita el patinaje de las ruedas motrices al arrancar, acelerar y decelerar.", "En un Duster 4x2 no hay interruptor de desconexión: el ESP no puede desactivarse manualmente."]}}, {"id": "abs2", "ch": "conduite", "kind": "text", "t": {"fr": "Freinage et ABS", "en": "Braking and ABS", "ar": "الفرملة و ABS", "es": "Frenado y ABS"}, "b": {"fr": ["En freinage d'urgence, appuyez fort et sans relâcher : l'ABS empêche le blocage des roues et vous laisse la direction.", "Les vibrations ressenties dans la pédale pendant une action de l'ABS sont normales.", "L'ABS ne raccourcit pas systématiquement les distances d'arrêt, en particulier sur gravier ou neige fraîche. Il préserve la capacité à diriger."], "en": ["In an emergency stop, press hard and keep the pressure on: the ABS stops the wheels locking and leaves you steering.", "Pedal vibration while the ABS is working is normal.", "ABS does not always shorten stopping distances, particularly on gravel or fresh snow. What it preserves is your ability to steer."], "ar": ["عند الفرملة الطارئة، اضغط بقوة ولا ترفع قدمك: يمنع ABS انغلاق العجلات ويترك لك التوجيه.", "الاهتزاز المحسوس في الدواسة أثناء عمل ABS أمر طبيعي.", "لا يقصّر ABS دائماً مسافة التوقف، خاصة على الحصى أو الثلج الطري. ما يحفظه هو القدرة على التوجيه."], "es": ["En una frenada de emergencia, pise fuerte y mantenga: el ABS evita el bloqueo de las ruedas y le deja dirigir.", "Las vibraciones en el pedal mientras actúa el ABS son normales.", "El ABS no siempre acorta la distancia de frenado, sobre todo en grava o nieve fresca. Lo que preserva es la capacidad de dirigir."]}}, {"id": "eco", "ch": "conduite", "kind": "text", "t": {"fr": "Conduite économique", "en": "Economical driving", "ar": "القيادة الاقتصادية", "es": "Conducción económica"}, "b": {"fr": ["Un moteur froid consomme nettement plus : les trajets courts et répétés sont les plus coûteux au kilomètre.", "Anticipez plutôt que de freiner : chaque freinage est de l'énergie déjà payée que vous jetez.", "Contrôlez la pression des pneumatiques une fois par mois. Un sous-gonflage augmente la consommation et l'usure.", "Retirez galerie et barres de toit quand vous ne les utilisez pas."], "en": ["A cold engine uses markedly more fuel: short repeated journeys are the most expensive per kilometre.", "Anticipate rather than brake: every brake application throws away energy you have already paid for.", "Check tyre pressures once a month. Under-inflation raises both consumption and wear.", "Remove roof bars and racks when you are not using them."], "ar": ["المحرك البارد يستهلك أكثر بوضوح: الرحلات القصيرة المتكررة هي الأغلى لكل كيلومتر.", "توقّع بدل أن تفرمل: كل فرملة هي طاقة دفعت ثمنها ثم رميتها.", "افحص ضغط الإطارات مرة في الشهر. نقص الضغط يرفع الاستهلاك والتآكل معاً.", "انزع قضبان السقف عندما لا تستعملها."], "es": ["Un motor frío consume bastante más: los trayectos cortos y repetidos son los más caros por kilómetro.", "Anticipe en lugar de frenar: cada frenada es energía ya pagada que se tira.", "Compruebe la presión de los neumáticos una vez al mes. La baja presión aumenta consumo y desgaste.", "Retire baca y barras de techo cuando no las use."]}}, {"id": "ceintures", "ch": "securite", "kind": "text", "t": {"fr": "Ceintures de sécurité", "en": "Seat belts", "ar": "أحزمة الأمان", "es": "Cinturones de seguridad"}, "b": {"fr": ["Réglez d'abord le siège et le dossier, puis la ceinture : sangle près du corps, brin diagonal sur l'épaule, brin ventral bas sur le bassin.", "Une seule personne par ceinture, jamais d'enfant sur les genoux.", "Aucun objet ne doit s'intercaler entre la sangle et le corps : un vêtement épais réduit l'efficacité.", "Après un accident, faites vérifier et si nécessaire remplacer les ceintures. Une ceinture qui a travaillé ne se réutilise pas."], "en": ["Adjust the seat and backrest first, then the belt: webbing close to the body, diagonal section over the shoulder, lap section low across the pelvis.", "One person per belt, never a child on someone's lap.", "Nothing should come between the webbing and the body: a thick coat reduces its effectiveness.", "After an accident, have the belts checked and replaced if needed. A belt that has taken a load is not reused."], "ar": ["اضبط المقعد والمسند أولاً ثم الحزام: الشريط قريب من الجسم، الجزء المائل فوق الكتف، والجزء البطني منخفض على الحوض.", "شخص واحد لكل حزام، ولا تضع طفلاً على الحضن أبداً.", "لا يجب أن يفصل أي شيء بين الشريط والجسم: المعطف السميك يقلل الفعالية.", "بعد الحادث، افحص الأحزمة واستبدلها عند اللزوم. الحزام الذي تحمّل قوة لا يُعاد استعماله."], "es": ["Ajuste primero el asiento y el respaldo, luego el cinturón: banda pegada al cuerpo, tramo diagonal sobre el hombro, tramo abdominal bajo sobre la pelvis.", "Una persona por cinturón, nunca un niño en el regazo.", "Nada debe interponerse entre la banda y el cuerpo: un abrigo grueso reduce su eficacia.", "Tras un accidente, haga revisar y si es necesario sustituir los cinturones. Un cinturón que ha trabajado no se reutiliza."]}}, {"id": "airbagpass", "ch": "securite", "kind": "text", "t": {"fr": "Airbag passager et siège enfant", "en": "Passenger airbag and child seat", "ar": "وسادة الراكب ومقعد الطفل", "es": "Airbag del pasajero y silla infantil"}, "b": {"fr": ["Un siège enfant dos à la route ne s'installe à l'avant qu'après désactivation de l'airbag passager. Sans cela, le déploiement peut être mortel.", "La désactivation se fait par le verrou situé sur le côté de la planche de bord, contact coupé. Le témoin de désactivation doit rester allumé.", "Réactivez l'airbag dès que le siège enfant est retiré.", "La place la plus sûre pour un enfant reste l'arrière."], "en": ["A rearward-facing child seat may only go in the front once the passenger airbag has been switched off. Otherwise deployment can be fatal.", "Switching off is done with the lock on the side of the dashboard, ignition off. The deactivation light must stay on.", "Switch the airbag back on as soon as the child seat is removed.", "The safest place for a child remains the rear."], "ar": ["مقعد الطفل الموجه عكس اتجاه السير لا يُركَّب في الأمام إلا بعد إيقاف وسادة الراكب. وإلا فقد يكون انتفاخها قاتلاً.", "الإيقاف يتم بالقفل الموجود على جانب لوحة القيادة، والمفتاح مطفأ. يجب أن يبقى مصباح الإيقاف مضاءً.", "أعد تفعيل الوسادة فور نزع مقعد الطفل.", "أأمن مكان للطفل يبقى في الخلف."], "es": ["Una silla infantil de espaldas a la marcha solo puede ir delante tras desactivar el airbag del pasajero. De lo contrario, su despliegue puede ser mortal.", "La desactivación se hace con la cerradura del lateral del salpicadero, con el contacto quitado. El testigo de desactivación debe permanecer encendido.", "Reactive el airbag en cuanto retire la silla infantil.", "El lugar más seguro para un niño sigue siendo atrás."]}}, {"id": "huile", "ch": "entretien", "kind": "text", "t": {"fr": "Niveau et vidange d'huile", "en": "Oil level and oil change", "ar": "مستوى الزيت وتغييره", "es": "Nivel y cambio de aceite"}, "b": {"fr": ["Contrôlez le niveau sur sol plat, moteur arrêté depuis plusieurs minutes. Le niveau ne doit jamais dépasser le repère maxi ni descendre sous le mini.", "Un dépassement du maxi est aussi grave qu'un manque : il peut endommager le moteur et le catalyseur.", "Le témoin de vidange ne compte que les kilomètres, jamais le temps. Respectez aussi la périodicité en mois.", "Au Maroc, une vidange à 7 500 km est plus prudente que l'intervalle du carnet, la teneur en soufre du gazole étant plus élevée."], "en": ["Check the level on level ground, with the engine stopped for several minutes. The level must never go above the max mark or below the min.", "Overfilling is as serious as running low: it can damage the engine and the catalytic converter.", "The service light counts kilometres only, never time. Respect the interval in months as well.", "In Morocco a 7,500 km interval is safer than the book figure, because diesel sulphur content is higher."], "ar": ["افحص المستوى على أرض مستوية والمحرك متوقف منذ عدة دقائق. يجب ألا يتجاوز المستوى العلامة القصوى ولا ينزل تحت الدنيا.", "تجاوز الحد الأقصى خطير كنقص الزيت: قد يتلف المحرك والمحول الحفاز.", "مصباح التغيير يحسب الكيلومترات فقط ولا يحسب الزمن. احترم كذلك المدة بالأشهر.", "في المغرب، التغيير كل 7500 كلم أحوط من الفترة المذكورة في الدفتر، لأن نسبة الكبريت في الديزل أعلى."], "es": ["Compruebe el nivel en suelo llano, con el motor parado varios minutos. El nivel nunca debe superar la marca máxima ni bajar de la mínima.", "Pasarse del máximo es tan grave como faltar: puede dañar el motor y el catalizador.", "El testigo de mantenimiento cuenta solo kilómetros, nunca tiempo. Respete también la periodicidad en meses.", "En Marruecos, un intervalo de 7.500 km es más prudente que el del cuaderno, por el mayor contenido de azufre del gasóleo."]}}, {"id": "niveaux", "ch": "entretien", "kind": "text", "t": {"fr": "Autres niveaux", "en": "Other levels", "ar": "المستويات الأخرى", "es": "Otros niveles"}, "b": {"fr": ["Liquide de refroidissement : contrôlez à froid, moteur arrêté. N'ouvrez jamais le vase d'expansion moteur chaud.", "Liquide de frein : le niveau baisse lentement avec l'usure des plaquettes. Une baisse rapide signale une fuite.", "Lave-vitre : n'utilisez pas d'eau seule, elle gèle et nettoie mal les insectes.", "Batterie : sans entretien, mais elle doit être remplacée par un modèle acceptant le branchement d'un tuyau de dégazage."], "en": ["Coolant: check cold, engine off. Never open the expansion tank on a hot engine.", "Brake fluid: the level drops slowly as the pads wear. A fast drop means a leak.", "Washer fluid: do not use plain water — it freezes and clears insects poorly.", "Battery: maintenance-free, but any replacement must accept a gas vent hose connection."], "ar": ["سائل التبريد: افحصه بارداً والمحرك مطفأ. لا تفتح خزان التمدد أبداً والمحرك ساخن.", "سائل الفرامل: ينخفض المستوى ببطء مع تآكل التيل. الانخفاض السريع يدل على تسرب.", "سائل غسل الزجاج: لا تستعمل الماء وحده، فهو يتجمد ولا ينظف الحشرات جيداً.", "البطارية: بدون صيانة، لكن يجب استبدالها بنوع يقبل توصيل أنبوب تصريف الغازات."], "es": ["Refrigerante: compruébelo en frío, con el motor parado. Nunca abra el vaso de expansión con el motor caliente.", "Líquido de frenos: el nivel baja lentamente con el desgaste de las pastillas. Una bajada rápida indica una fuga.", "Lavaparabrisas: no use solo agua — se congela y limpia mal los insectos.", "Batería: sin mantenimiento, pero cualquier recambio debe admitir la conexión de un tubo de desgasificación."]}}, {"id": "filtreair", "ch": "entretien", "kind": "text", "t": {"fr": "Filtre à air et filtre à gazole", "en": "Air filter and fuel filter", "ar": "مرشح الهواء ومرشح الديزل", "es": "Filtro de aire y filtro de gasóleo"}, "b": {"fr": ["Le remplacement du filtre à air est prévu au plan d'entretien, mais contrôlez-le plus souvent si vous roulez en milieu poussiéreux — ce qui est le cas courant au Maroc.", "Un indicateur de colmatage à 100 % impose un remplacement rapide. Après remplacement, tournez le bouton du capteur jusqu'en butée pour le réinitialiser.", "Le filtre à gazole retient l'eau. Si le témoin correspondant s'allume, faites-le purger sans attendre."], "en": ["Air filter replacement is in the service schedule, but check it more often if you drive in dusty conditions — which is the norm in Morocco.", "A clogging indicator at 100% means replace it promptly. After replacement, turn the sensor knob to its stop to reset it.", "The fuel filter traps water. If the corresponding light comes on, have it drained without delay."], "ar": ["استبدال مرشح الهواء مقرر في برنامج الصيانة، لكن افحصه أكثر إذا كنت تسير في أجواء مغبرة — وهو الحال المعتاد في المغرب.", "مؤشر الانسداد عند 100% يفرض استبدالاً سريعاً. بعد الاستبدال، أدر زر المستشعر حتى النهاية لتصفيره.", "مرشح الديزل يحتجز الماء. إذا أضاء المصباح المخصص، فرّغه دون تأخير."], "es": ["La sustitución del filtro de aire está en el plan de mantenimiento, pero revíselo más a menudo si circula en ambiente polvoriento — lo habitual en Marruecos.", "Un indicador de obstrucción al 100 % obliga a sustituirlo pronto. Tras el cambio, gire el botón del sensor hasta el tope para reiniciarlo.", "El filtro de gasóleo retiene agua. Si se enciende el testigo correspondiente, hágalo purgar sin demora."]}}, {"id": "pression", "ch": "pneus", "kind": "text", "t": {"fr": "Pression de gonflage", "en": "Inflation pressure", "ar": "ضغط النفخ", "es": "Presión de inflado"}, "b": {"fr": ["Les pressions exactes de votre véhicule figurent sur l'étiquette collée sur le chant de la porte conducteur : ouvrez la porte pour la lire.", "L'étiquette distingue avant et arrière, ainsi que l'usage hors autoroute et sur autoroute, et donne la pression de la roue de secours.", "Contrôlez toujours à froid. Un pneu qui a roulé affiche une pression plus élevée qui ne veut rien dire.", "Pleine charge avec remorque : limitez la vitesse à 100 km/h et augmentez la pression de 0,2 bar."], "en": ["The exact pressures for your car are on the label on the driver's door pillar: open the door to read it.", "The label separates front from rear, and non-motorway from motorway use, and gives the spare wheel pressure.", "Always check cold. A tyre that has been driven on reads higher, and that figure means nothing.", "Fully laden with a trailer: limit speed to 100 kph and raise pressures by 0.2 bar."], "ar": ["الضغوط الدقيقة لسيارتك مدونة على الملصق الموجود على حافة باب السائق: افتح الباب لقراءته.", "يفرق الملصق بين الأمام والخلف، وبين الاستعمال خارج الطريق السيار وعليه، ويعطي ضغط العجلة الاحتياطية.", "افحص دائماً والإطار بارد. الإطار الذي سار يظهر ضغطاً أعلى لا معنى له.", "بحمولة كاملة مع مقطورة: حدّ السرعة في 100 كم/س وارفع الضغط 0.2 بار."], "es": ["Las presiones exactas de su vehículo están en la etiqueta del canto de la puerta del conductor: abra la puerta para leerla.", "La etiqueta distingue delante y detrás, uso fuera de autopista y en autopista, y da la presión de la rueda de repuesto.", "Compruebe siempre en frío. Un neumático rodado marca más presión, y esa cifra no sirve.", "A plena carga con remolque: limite la velocidad a 100 km/h y aumente la presión 0,2 bar."]}}, {"id": "pneuent", "ch": "pneus", "kind": "text", "t": {"fr": "Entretien et remplacement", "en": "Care and replacement", "ar": "الصيانة والاستبدال", "es": "Mantenimiento y sustitución"}, "b": {"fr": ["Au remplacement, montez des pneumatiques de même marque, dimension, type et structure — identiques à l'origine ou conformes à la préconisation.", "Un bouchon de valve manquant ou mal vissé nuit à l'étanchéité et provoque des pertes de pression. Gardez toujours des bouchons identiques aux d'origine.", "Vérifiez l'usure sur toute la largeur : une usure irrégulière signale un défaut de géométrie ou de pression."], "en": ["When replacing, fit tyres of the same make, size, type and construction — either identical to the originals or as recommended.", "A missing or loose valve cap harms the seal and causes pressure loss. Always keep caps identical to the originals.", "Check wear across the full width: uneven wear points to an alignment or pressure problem."], "ar": ["عند الاستبدال، ركّب إطارات من نفس الماركة والمقاس والنوع والبنية — مطابقة للأصلية أو حسب التوصية.", "غطاء الصمام المفقود أو غير المُحكم يضر بالإحكام ويسبب فقدان الضغط. احتفظ دائماً بأغطية مطابقة للأصلية.", "افحص التآكل على كامل العرض: التآكل غير المنتظم يدل على خلل في الهندسة أو الضغط."], "es": ["Al sustituir, monte neumáticos de la misma marca, dimensión, tipo y estructura — idénticos a los originales o los recomendados.", "Un tapón de válvula ausente o mal roscado perjudica la estanqueidad y provoca pérdidas de presión. Tenga siempre tapones idénticos a los originales.", "Revise el desgaste en todo el ancho: un desgaste irregular indica un problema de geometría o de presión."]}}, {"id": "kit", "ch": "panne", "kind": "text", "t": {"fr": "Kit de gonflage (crevaison)", "en": "Inflation kit (puncture)", "ar": "طقم النفخ (ثقب)", "es": "Kit de inflado (pinchazo)"}, "b": {"fr": ["Sur un Duster 4x2, le kit se trouve à gauche dans le coffre. Il remplace la roue de secours.", "Garez-vous à l'écart de la circulation, allumez les feux de détresse, serrez le frein à main et faites descendre tout le monde loin de la chaussée.", "Ne retirez pas le corps étranger s'il est encore planté dans le pneumatique.", "Contact mis, branchez l'embout sur la prise d'accessoires, vissez l'embout sur la valve et gonflez. Arrêtez au bout de 7 minutes maximum pour lire la pression. Le kit ne doit jamais fonctionner plus de 15 minutes d'affilée.", "Si la pression préconisée n'est pas atteinte, la réparation est impossible : ne repartez pas.", "Après réparation : 200 km maximum, 80 km/h maximum. Contrôlez la pression après 10 km ou 10 minutes.", "Vérifiez la date de péremption de la bouteille : elle a une durée de vie limitée."], "en": ["On a 4x2 Duster the kit sits on the left in the boot. It replaces the spare wheel.", "Park clear of traffic, switch on the hazards, apply the handbrake and get everyone out and away from the road.", "Do not pull out the object if it is still embedded in the tyre.", "With the ignition on, plug the lead into the accessory socket, screw the hose onto the valve and inflate. Stop after 7 minutes at most to read the pressure. The kit must never run more than 15 minutes at a stretch.", "If the recommended pressure is not reached, repair is not possible: do not drive on.", "After repair: 200 km maximum, 80 kph maximum. Check the pressure after 10 km or 10 minutes.", "Check the bottle's expiry date: it has a limited shelf life."], "ar": ["في داستر 4x2 يوجد الطقم على اليسار في الصندوق. وهو يعوّض العجلة الاحتياطية.", "اركن بعيداً عن حركة السير، شغّل أضواء الخطر، اشدد فرملة اليد وأنزل الجميع بعيداً عن الطريق.", "لا تنزع الجسم الغريب إذا كان لا يزال مغروساً في الإطار.", "مع تشغيل المفتاح، صل القابس بمأخذ الملحقات، اربط الخرطوم على الصمام وانفخ. توقف بعد 7 دقائق كحد أقصى لقراءة الضغط. لا يجب أن يعمل الطقم أكثر من 15 دقيقة متواصلة.", "إذا لم يُبلغ الضغط الموصى به، فالإصلاح غير ممكن: لا تكمل الطريق.", "بعد الإصلاح: 200 كلم كحد أقصى، 80 كم/س كحد أقصى. افحص الضغط بعد 10 كلم أو 10 دقائق.", "تحقق من تاريخ صلاحية القارورة: لها عمر محدود."], "es": ["En un Duster 4x2 el kit va a la izquierda del maletero. Sustituye a la rueda de repuesto.", "Aparque lejos del tráfico, encienda las luces de emergencia, ponga el freno de mano y haga bajar a todos lejos de la calzada.", "No retire el objeto extraño si sigue clavado en el neumático.", "Con el contacto dado, enchufe el conector en la toma de accesorios, rosque la boquilla en la válvula e infle. Pare a los 7 minutos como máximo para leer la presión. El kit nunca debe funcionar más de 15 minutos seguidos.", "Si no se alcanza la presión recomendada, la reparación no es posible: no siga circulando.", "Tras la reparación: 200 km máximo, 80 km/h máximo. Compruebe la presión a los 10 km o 10 minutos.", "Compruebe la fecha de caducidad del bote: tiene vida limitada."]}}, {"id": "secours", "ch": "panne", "kind": "text", "t": {"fr": "Signalisation et sécurité", "en": "Warning others and safety", "ar": "التنبيه والسلامة", "es": "Señalización y seguridad"}, "b": {"fr": ["Arrêt sur le bas-côté : signalez votre présence avec le triangle de présignalisation, placé assez loin en amont.", "Feux de détresse : les quatre clignotants et les répétiteurs latéraux fonctionnent ensemble. À n'utiliser qu'en cas de danger réel.", "Aucun objet ne doit se trouver aux pieds du conducteur : un freinage brusque peut l'envoyer sous le pédalier et bloquer les commandes."], "en": ["Stopped on the verge: mark your presence with the warning triangle, placed well back up the road.", "Hazard lights: all four indicators and the side repeaters work together. Use only in real danger.", "Nothing should lie in the driver's footwell: hard braking can send it under the pedals and jam the controls."], "ar": ["التوقف على جانب الطريق: نبّه إلى وجودك بمثلث التحذير موضوعاً على مسافة كافية خلف السيارة.", "أضواء الخطر: الغمازات الأربع والمكررات الجانبية تعمل معاً. لا تستعملها إلا عند خطر حقيقي.", "لا يجب أن يوجد أي شيء عند قدمي السائق: الفرملة المفاجئة قد ترسله تحت الدواسات وتعطل التحكم."], "es": ["Detenido en el arcén: señale su presencia con el triángulo, colocado bastante antes del vehículo.", "Luces de emergencia: los cuatro intermitentes y los repetidores laterales funcionan a la vez. Úselas solo ante peligro real.", "Nada debe quedar en los pies del conductor: una frenada brusca puede llevarlo bajo los pedales y bloquear los mandos."]}}, {"id": "moteur", "ch": "specs", "kind": "kv", "t": {"fr": "Moteur", "en": "Engine", "ar": "المحرك", "es": "Motor"}, "b": {"fr": ["Type moteur|K9K", "Cylindrée|1 461 cm³", "Cylindres|4 en ligne", "Carburant|Gazole", "Puissance|90 ch", "Puissance fiscale|6 CV", "Transmission|4x2 (traction avant)"], "en": ["Engine type|K9K", "Displacement|1,461 cc", "Cylinders|4 in line", "Fuel|Diesel", "Power|90 hp", "Tax rating|6 CV", "Drivetrain|4x2 (front-wheel drive)"], "ar": ["نوع المحرك|K9K", "سعة المحرك|1461 سم³", "الأسطوانات|4 على التوالي", "الوقود|ديزل", "القدرة|90 حصان", "القوة الجبائية|6 CV", "نقل الحركة|4x2 (دفع أمامي)"], "es": ["Tipo de motor|K9K", "Cilindrada|1.461 cm³", "Cilindros|4 en línea", "Combustible|Gasóleo", "Potencia|90 CV", "Potencia fiscal|6 CV", "Transmisión|4x2 (tracción delantera)"]}}, {"id": "dimensions", "ch": "specs", "kind": "kv", "t": {"fr": "Dimensions", "en": "Dimensions", "ar": "الأبعاد", "es": "Dimensiones"}, "b": {"fr": ["Longueur|4,315 m", "Largeur (hors rétroviseurs)|1,822 m", "Hauteur à vide|1,690 m", "Empattement|2,673 m", "Voie avant|1,560 m", "Voie arrière|1,567 m", "Porte-à-faux avant|0,822 m", "Porte-à-faux arrière|0,820 m"], "en": ["Length|4.315 m", "Width (excl. mirrors)|1.822 m", "Unladen height|1.690 m", "Wheelbase|2.673 m", "Front track|1.560 m", "Rear track|1.567 m", "Front overhang|0.822 m", "Rear overhang|0.820 m"], "ar": ["الطول|4.315 م", "العرض (دون المرايا)|1.822 م", "الارتفاع فارغة|1.690 م", "قاعدة العجلات|2.673 م", "المسار الأمامي|1.560 م", "المسار الخلفي|1.567 م", "البروز الأمامي|0.822 م", "البروز الخلفي|0.820 م"], "es": ["Longitud|4,315 m", "Anchura (sin retrovisores)|1,822 m", "Altura en vacío|1,690 m", "Batalla|2,673 m", "Vía delantera|1,560 m", "Vía trasera|1,567 m", "Voladizo delantero|0,822 m", "Voladizo trasero|0,820 m"]}}, {"id": "masses", "ch": "specs", "kind": "kv", "t": {"fr": "Masses et remorquage", "en": "Weights and towing", "ar": "الأوزان والقطر", "es": "Masas y remolque"}, "b": {"fr": ["Remorque non freinée (4x2 1.5 dCi)|625 kg", "Charge sur point d'attelage|50 kg", "Charge sur le toit|80 kg dispositif de portage compris", "MMAC et MTR|voir plaque constructeur", "Remorque freinée|MTR − MMAC", "Attelage : vitesse max|100 km/h, pression +0,2 bar", "Altitude|réduire la charge de 10 % par tranche de 1 000 m"], "en": ["Unbraked trailer (4x2 1.5 dCi)|625 kg", "Towball download|50 kg", "Roof load|80 kg including the carrier", "GVW and GTW|see the manufacturer's plate", "Braked trailer|GTW − GVW", "Towing: max speed|100 kph, pressures +0.2 bar", "Altitude|reduce the load by 10% per 1,000 m"], "ar": ["مقطورة بدون فرامل (4x2 1.5 dCi)|625 كلغ", "الحمل على نقطة القطر|50 كلغ", "الحمل على السقف|80 كلغ بما في ذلك حامل الأمتعة", "الوزن الأقصى والوزن الإجمالي|انظر لوحة الصانع", "مقطورة مفرملة|الوزن الإجمالي − الوزن الأقصى", "القطر: السرعة القصوى|100 كم/س، الضغط +0.2 بار", "الارتفاع|خفّض الحمولة 10% لكل 1000 م"], "es": ["Remolque sin frenos (4x2 1.5 dCi)|625 kg", "Carga sobre la bola|50 kg", "Carga en el techo|80 kg incluido el portaequipajes", "MMA y MTR|ver la placa del fabricante", "Remolque frenado|MTR − MMA", "Con remolque: velocidad máx.|100 km/h, presión +0,2 bar", "Altitud|reducir la carga un 10 % por cada 1.000 m"]}}, {"id": "plaques", "ch": "specs", "kind": "text", "t": {"fr": "Plaques d'identification", "en": "Identification plates", "ar": "لوحات التعريف", "es": "Placas de identificación"}, "b": {"fr": ["La plaque constructeur porte le type mine et le numéro de série, la MMAC, la MTR, les masses maxi par essieu, la référence peinture, le niveau d'équipement, le code sellerie et le numéro de fabrication.", "La plaque moteur porte le type moteur, son indice et son numéro. Son emplacement varie selon la motorisation.", "Reprenez ces indications dans toute commande de pièces : c'est ce qui évite de recevoir une pièce d'une autre finition."], "en": ["The manufacturer's plate carries the type approval and serial number, GVW, GTW, maximum axle loads, paint reference, equipment level, trim code and production number.", "The engine plate carries the engine type, its index and its number. Its location varies with the engine.", "Quote these details on any parts order: it is what stops you receiving a part for a different trim level."], "ar": ["لوحة الصانع تحمل نوع السيارة ورقمها التسلسلي، الوزن الأقصى، الوزن الإجمالي، الأوزان القصوى لكل محور، مرجع الطلاء، مستوى التجهيز، رمز الفرش ورقم التصنيع.", "لوحة المحرك تحمل نوع المحرك ومؤشره ورقمه. موقعها يختلف حسب المحرك.", "أورد هذه المعلومات في أي طلب لقطع الغيار: هي ما يمنع وصول قطعة تخص مستوى تجهيز آخر."], "es": ["La placa del fabricante lleva el tipo homologado y el número de serie, la MMA, la MTR, las masas máximas por eje, la referencia de pintura, el nivel de equipamiento, el código de tapicería y el número de fabricación.", "La placa del motor lleva el tipo de motor, su índice y su número. Su ubicación varía según la motorización.", "Cite estos datos en cualquier pedido de piezas: es lo que evita recibir una pieza de otro acabado."]}}, {"id": "pieces", "ch": "specs", "kind": "text", "t": {"fr": "Pièces de rechange", "en": "Spare parts", "ar": "قطع الغيار", "es": "Piezas de recambio"}, "b": {"fr": ["Les pièces d'origine sont conçues sur un cahier des charges strict et testées spécifiquement : leur niveau de qualité est au moins équivalent à celles montées en usine.", "Sur les éléments de sécurité — freinage, direction, liaison au sol — l'économie réalisée sur une pièce d'origine se paie ailleurs.", "Pour les consommables courants, une pièce d'équipementier de premier rang reste un choix raisonnable."], "en": ["Original parts are designed to a strict specification and specifically tested: their quality is at least equal to what left the factory.", "On safety items — braking, steering, suspension — money saved against an original part is paid back elsewhere.", "For routine consumables, a tier-one supplier part remains a reasonable choice."], "ar": ["قطع الغيار الأصلية مصممة وفق دفتر شروط صارم وتخضع لاختبارات خاصة: جودتها لا تقل عن تلك المركبة في المصنع.", "في عناصر السلامة — الفرملة، التوجيه، نظام التعليق — ما توفره على قطعة أصلية تدفعه في مكان آخر.", "أما المستهلكات العادية، فقطعة من مورّد من الصف الأول تبقى خياراً معقولاً."], "es": ["Las piezas originales se diseñan con un pliego estricto y se someten a ensayos específicos: su calidad es al menos equivalente a la de fábrica.", "En elementos de seguridad — frenos, dirección, tren de rodaje — lo ahorrado frente a una pieza original se paga en otro sitio.", "Para consumibles corrientes, una pieza de un fabricante de primer nivel sigue siendo una elección razonable."]}}], "icons": {"stop": "<circle cx=\"24\" cy=\"24\" r=\"15\"/><path d=\"M24 15v12\"/><circle cx=\"24\" cy=\"32\" r=\"1.6\" fill=\"currentColor\"/>", "oil": "<path d=\"M9 30h20l6-6h5v6c0 3-2 5-5 5H14c-3 0-5-2-5-5z\"/><path d=\"M14 24c0-4 4-6 4-6s4 2 4 6\"/><path d=\"M35 20l4-5\"/>", "batt": "<rect x=\"9\" y=\"16\" width=\"30\" height=\"18\" rx=\"2\"/><path d=\"M15 12h6v4h-6zM27 12h6v4h-6z\"/><path d=\"M15 25h7M18.5 21.5v7M26 25h7\"/>", "temp": "<path d=\"M24 12v14\"/><circle cx=\"24\" cy=\"31\" r=\"5\"/><path d=\"M12 18h7M12 24h7M29 18h7M29 24h7\"/>", "brake": "<circle cx=\"24\" cy=\"24\" r=\"10\"/><path d=\"M24 17v9\"/><circle cx=\"24\" cy=\"30\" r=\"1.4\" fill=\"currentColor\"/><path d=\"M8 15c3 4 3 14 0 18M40 15c-3     return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* Normalisation pour la recherche : minuscules, accents latins retires,
     diacritiques arabes retires. Sans cela « temoin » ne trouverait pas

  function norm(s) {
    s = String(s).toLowerCase();
    var from = 'áàâäãåéèêëíìîïóòôöõúùûüçñ';
    var to   = 'aaaaaaeeeeiiiiooooouuuucn';
    var out = '';
    for (var i = 0; i < s.length; i++) {
      var c = s.charAt(i), k = from.indexOf(c);
      out += (k >= 0) ? to.charAt(k) : c;
    }
    out = out.replace(/[\u064B-\u065F\u0670]/g, '');   // diacritiques arabes
    out = out.replace(/[\u0622\u0623\u0625]/g, '\u0627'); // alifs -> alif nu
    out = out.replace(/\u0629/g, '\u0647');              // ta marbuta -> ha
    out = out.replace(/[\u0649]/g, '\u064A');            // alif maqsura -> ya
    return out;
  }

  function hi(text) {
    var safe = esc(text);
    if (!term) return safe;
    var n = norm(safe), t = norm(term), out = '', i = 0;
    while (true) {
      var p = n.indexOf(t, i);
      if (p < 0) { out += safe.substring(i); break; }
      out += safe.substring(i, p) + '<mark>' + safe.substring(p, p + t.length) + '</mark>';
      i = p + t.length;
    }
    return out;
  }

  function chapTitle(cid) {
    for (var i = 0; i < DATA.chapters.length; i++)
      if (DATA.chapters[i].id === cid) return DATA.chapters[i].t[lang];
    return '';
  }

  function haystack(s) {
    return norm(s.t[lang] + ' ' + s.b[lang].join(' ') + ' ' + chapTitle(s.ch));
  }

  function matches() {
    var out = [], t = norm(term);
    for (var i = 0; i < DATA.sections.length; i++)
      if (!t || haystack(DATA.sections[i]).indexOf(t) >= 0) out.push(i);
    return out;
  }

  function snippet(s) {
    if (!term) return '';
    var t = norm(term);
    for (var i = 0; i < s.b[lang].length; i++) {
      var line = s.b[lang][i].split('|').join(' : ');
      var p = norm(line).indexOf(t);
      if (p >= 0) {
        var a = Math.max(0, p - 34);
        var frag = (a > 0 ? '… ' : '') + line.substring(a, a + 110)
                 + (a + 110 < line.length ? ' …' : '');
        return hi(frag);
      }
    }
    return '';
  }

  /* SVG complet a chaque fois plutot qu'un sprite : use/xlink reste muet
     sur les WebView anciens quand le sprite est en display:none. */
  function svgIcon(name, lvl, cls) {
    var d = DATA.icons[name];
    if (!d) return '';
    return '<div class="' + cls + ' ' + lvl + '">'
         + '<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">' + d + '</svg>'
         + '</div>';
  }

  function iconOf(s) {
    if (s.kind !== 'light') return '';
    return svgIcon(s.icon, s.lvl, 'ic');
  }

  /* ---- sommaire ---- */
  function renderToc() {
    var idx = matches(), html = '';

    if (!term) html += '<div class="note">' + esc(DATA.ui.note[lang]) + '</div>';
    else html += '<div class="note">' + idx.length + ' ' + esc(DATA.ui.results[lang]) + '</div>';

    if (!idx.length) {
      body.innerHTML = html + '<div class="note">' + esc(DATA.ui.nores[lang]) + '</div>';
      return;
    }

    var lastCh = null;
    for (var j = 0; j < idx.length; j++) {
      var i = idx[j], s = DATA.sections[i];
      if (s.ch !== lastCh) {
        if (lastCh !== null) html += '</div>';
        html += '<div class="chap"><div class="chaph">' + esc(chapTitle(s.ch)) + '</div>';
        lastCh = s.ch;
      }
      var sn = snippet(s);
      html += '<div class="item" data-i="' + i + '">'
            + iconOf(s)
            + '<div class="lb"><div>' + hi(s.t[lang]) + '</div>'
            + (sn ? '<div class="sn">' + sn + '</div>' : '')
            + '</div><div class="ar">›</div></div>';
    }
    html += '</div>';
    body.innerHTML = html;

    var items = body.getElementsByClassName('item');
    for (var k = 0; k < items.length; k++) {
      items[k].onclick = (function (el) {
        return function () { open(parseInt(el.getAttribute('data-i'), 10)); };
      })(items[k]);
    }
  }

  /* ---- article ---- */
  function renderArt() {
    var s = DATA.sections[cur], html = '';
    html += '<div class="kicker">' + esc(chapTitle(s.ch)) + '</div>';

    if (s.kind === 'light') {
      html += '<div class="lighthead">'
            + svgIcon(s.icon, s.lvl, 'ic')
            + '<div><h2>' + hi(s.t[lang]) + '</h2>'
            + '<span class="badgelvl ' + s.lvl + '">' + s.lvl + '</span></div></div>';
    } else {
      html += '<h2>' + hi(s.t[lang]) + '</h2><div style="height:10px"></div>';
    }

    if (s.kind === 'kv') {
      html += '<table class="kv">';
      for (var i = 0; i < s.b[lang].length; i++) {
        var kv = s.b[lang][i].split('|');
        html += '<tr><td class="k">' + hi(kv[0]) + '</td><td class="v">' + hi(kv[1] || '') + '</td></tr>';
      }
      html += '</table>';
    } else {
      for (var j = 0; j < s.b[lang].length; j++)
        html += '<p>' + hi(s.b[lang][j]) + '</p>';
    }

    body.innerHTML = '<div id="art">' + html + '</div>';
    body.scrollTop = 0;
  }

  /* ---- navigation ---- */
  function open(i) { cur = i; view = 'art'; render(); }
  function toToc()  { view = 'toc'; render(); }

  function step(d) {
    var idx = matches();
    if (!idx.length) return;
    var at = -1;
    for (var i = 0; i < idx.length; i++) if (idx[i] === cur) at = i;
    if (at < 0) { open(idx[0]); return; }
    var n = at + d;
    if (n < 0 || n >= idx.length) return;
    open(idx[n]);
  }

  function render() {
    var u = DATA.ui;
    $('t1').innerHTML = esc(u.app[lang]);
    $('t2').innerHTML = esc(u.sub[lang]);
    q.setAttribute('placeholder', u.search[lang]);
    clr.innerHTML = esc(u.clear[lang]);
    clr.style.display = term ? '' : 'none';

    var prev = $('bprev'), next = $('bnext');
    if (view === 'toc') {
      prev.innerHTML = esc(u.toc[lang]); prev.disabled = true;
      next.innerHTML = esc(u.toc[lang]); next.disabled = true;
      prev.style.visibility = 'hidden'; next.style.visibility = 'hidden';
      renderToc();
    } else {
      prev.style.visibility = ''; next.style.visibility = '';
      var idx = matches(), at = -1;
      for (var i = 0; i < idx.length; i++) if (idx[i] === cur) at = i;
      prev.innerHTML = '‹ ' + esc(u.prev[lang]);
      next.innerHTML = esc(u.next[lang]) + ' ›';
      prev.disabled = (at <= 0);
      next.disabled = (at < 0 || at >= idx.length - 1);
      renderArt();
    }
  }

  /* ---- langues ---- */
  var LNAMES = { fr: 'FR', en: 'EN', ar: 'ع', es: 'ES' };
  (function () {
    var box = $('langs'), order = ['fr', 'en', 'ar', 'es'];
    for (var i = 0; i < order.length; i++) {
      var b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = LNAMES[order[i]];
      b.setAttribute('data-l', order[i]);
      b.onclick = (function (el) {
        return function () { setLang(el.getAttribute('data-l')); };
      })(b);
      box.appendChild(b);
    }
  })();

  function setLang(l) {
    lang = l;
    var rtl = (l === 'ar');
    document.documentElement.setAttribute('dir', rtl ? 'rtl' : 'ltr');
    document.documentElement.setAttribute('lang', l);
    var bs = $('langs').getElementsByTagName('button');
    for (var i = 0; i < bs.length; i++)
      bs[i].className = (bs[i].getAttribute('data-l') === l) ? 'on' : '';
    render();
  }

  /* ---- evenements ---- */
  var typing = null;
  q.oninput = q.onkeyup = function () {
    if (typing) clearTimeout(typing);
    typing = setTimeout(function () {
      var v = q.value.replace(/^\s+|\s+$/g, '');
      if (v === term) return;
      term = v;
      view = 'toc';
      render();
    }, 120);
  };
  clr.onclick = function () { q.value = ''; term = ''; view = 'toc'; q.focus(); render(); };

  $('bprev').onclick = function () { step(-1); };
  $('bnext').onclick = function () { step(1); };
  $('duster').onclick = toToc;
  $('badge').onclick = toToc;

  document.onkeydown = function (e) {
    if (view !== 'art') return;
    if (e.keyCode === 37) step(document.documentElement.getAttribute('dir') === 'rtl' ? 1 : -1);
    if (e.keyCode === 39) step(document.documentElement.getAttribute('dir') === 'rtl' ? -1 : 1);
    if (e.keyCode === 27) toToc();
  };

  /* Crochet pour le bouton RETOUR d'Android : renvoie false quand on est
     deja au sommaire, ce qui laisse l'activite se fermer normalement. */
  window.manualBack = function () {
    if (view === 'art') { toToc(); return true; }
    if (term) { q.value = ''; term = ''; render(); return true; }
    return false;
  };

  setLang('fr');
})();
</script>
</body>
</html>
